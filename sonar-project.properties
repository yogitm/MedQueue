# ==========================================
# MedQueue - SonarQube Scanner Configuration
# ==========================================

sonar.projectKey=MedQueue
sonar.projectName=MedQueue - Sistem Manajemen Antrean
sonar.projectVersion=1.0.0

# Source & Test Code Paths
sonar.sources=backend/src,frontend/src
sonar.tests=backend/test

# Encodings & Exclusions
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/dist/**,**/scratch/**,**/*.test.js

# Coverage Exclusions: Frontend tidak memiliki unit test runner (Vue SPA), sehingga coverage hanya dihitung untuk backend
sonar.coverage.exclusions=frontend/**,backend/src/config/database.js

# Test & Coverage Settings
sonar.test.inclusions=backend/test/**/*.test.js
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

